name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *" # catches regressions from upstream hassfest/HACS changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validate for HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" requires a separate submission to home-assistant/brands
          # before this integration is published to the HACS default store;
          # not something CI here can satisfy on its own.
          ignore: "brands"

  test:
    name: Unit tests (no Home Assistant core installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install aiohttp voluptuous pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -q

  test-full:
    name: Full integration tests (real Home Assistant core)
    runs-on: ubuntu-latest
    # This is the one place Home Assistant core is installed for this
    # project -- deliberately only here, in a GitHub-hosted cloud runner,
    # never on a contributor's own machine (see tests_full/conftest.py).
    # Covers everything tests/ structurally can't: the actual ConfigFlow,
    # DataUpdateCoordinator, and entity platform classes.
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          # Caches pip's downloaded/built wheels keyed on this file's hash
          # (still versions unpinned -- see requirements.txt, deliberately
          # so the daily schedule run above keeps testing against whatever
          # is actually latest). Installing HA core is the slow part of
          # this job; without this it re-downloads and rebuilds the whole
          # dependency tree from scratch on every single run.
          cache: pip
          cache-dependency-path: tests_full/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests_full/requirements.txt

      - name: Run full integration tests
        working-directory: tests_full
        run: python -m pytest -q
