[pytest]
asyncio_mode = auto
testpaths = .
; pytest-homeassistant-custom-component bundles pytest-socket, which
; blocks all real network sockets by default (to catch integrations that
; accidentally skip HA's mocking conventions). This suite deliberately
; does real local I/O against a real aiohttp server standing in for the
; App: same pattern as the rest of this project's tests: so localhost
; needs to stay allowed; only genuinely external hosts stay blocked.
addopts = --allow-hosts=127.0.0.1,::1

; A separate rootdir/config from ../pytest.ini on purpose: this suite
; needs pytest-homeassistant-custom-component (and therefore real Home
; Assistant core) installed, which the top-level tests/ suite deliberately
; never requires. Keeping them in separate pytest rootdirs means running
; one never accidentally picks up the other's conftest/plugins.
